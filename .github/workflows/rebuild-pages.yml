name: Rebuild weapon pages

# Rebuilds only the weapon pages (w/<id>/) and sitemap.xml, without fetching any new data.
# Runs by itself when the page template or the page builder changes, and takes about a minute.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data        # same queue as the daily update, so the two never save at once

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build weapon pages
        run: node scripts/build-pages.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add w sitemap.xml
          if git diff --cached --quiet; then
            echo "Weapon pages already up to date"
          else
            git commit -m "Rebuild weapon pages"
            git pull --rebase
            git push
          fi
