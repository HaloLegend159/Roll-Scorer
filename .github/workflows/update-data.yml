name: Update roll data

on:
  workflow_dispatch:        # run it by hand from the Actions tab
  schedule:
    - cron: '30 18 * * 2'   # Tuesdays after weekly reset (UTC)
    - cron: '30 18 * * 5'   # Fridays, to catch wish list updates

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build data from Bungie manifest + wish list
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-data.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # meta.json changes every run, so ignore it when deciding whether to commit
          if git diff --cached --quiet -- data ':!data/meta.json'; then
            echo "No roll data changes"
          else
            git commit -m "Update roll data"
            git push
          fi
